name: Update Documentation

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: docs-update
  cancel-in-progress: true

jobs:
  update-docs:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai@1.18.23

      - name: Run OpenCode to update docs
        timeout-minutes: 30
        shell: bash
        run: |
          cat << 'EOF' > opencode-prompt.md
          Read the repository (README.md, docs/*.md, skills/agenv/SKILL.md, src/cli.ts command definitions, package.json).
          Synchronize documentation with the actual CLI: update README.md, docs/CLI.md, docs/SETUP-GUIDE.md, docs/ENVIRONMENTS.md, docs/INSTALL-WITHOUT-NPM.md, skills/agenv/SKILL.md so every documented command/flag exists in the code and matches reality.
          Fix inconsistencies (command names, flags, key paths like `~/.config/agenv/key.txt`, registry `~/.config/agenv/registry.json`).
          Do NOT touch source code in src/ or tests/ except if a doc claims something plainly wrong — then prefer fixing the doc.
          Do NOT run git commands (workflow handles it).
          Keep changes focused, don't restructure docs.
          NEVER modify files under .github/workflows/ or any CI/CD configuration.
          EOF
          # Walk free Zen models first; fall back to the CLI's default model.
          set +e
          for m in opencode/grok-code opencode/code-supernova ""; do
            echo "Trying model: ${m:-<default>}"
            if [ -z "$m" ]; then
              opencode run "$(cat opencode-prompt.md)" && ok=1 && break
            else
              opencode run "$(cat opencode-prompt.md)" --model "$m" && ok=1 && break
            fi
          done
          set -e
          rm -f opencode-prompt.md
          [ "${ok:-}" = "1" ] || { echo '::error::all OpenCode models failed'; exit 1; }

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs skills
          git diff --cached --quiet || git commit -m "docs: auto-sync docs and skills with CLI (via OpenCode)"
          git push

