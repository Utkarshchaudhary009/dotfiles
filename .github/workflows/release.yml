name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & Attach Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.0.1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Node Compat Check
        run: node dist/agenv.js --version

      - name: Create Release and Attach Bundle
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: dist/agenv.js
          generate_release_notes: true
